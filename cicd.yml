name: CI/CD

on:
  push:
    branches: [ main ]

jobs:
  build-test-healthcheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      # --- ТЕСТЫ ---
      - name: Run tests
        run: ./mvnw clean test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/videogames_shop
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: 1234
          SPRING_JPA_HIBERNATE_DDL_AUTO: validate

      # --- СБОРКА ---
      - name: Build Docker image
        run: docker build -t videogames-shop-app .

      # --- ЗАПУСК ---
      - name: Start app with Docker Compose
        run: |
          POSTGRES_USER=postgres \
          POSTGRES_PASSWORD=1234 \
          POSTGRES_DB=videogames_shop \
          POSTGRES_PORT=5432 \
          APP_PORT=8080 \
          SPRING_JPA_HIBERNATE_DDL_AUTO=validate \
          docker compose up -d --build

      # --- HEALTHCHECK ---
      - name: Wait for healthcheck
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:8080/actuator/health; then
              echo "Application is healthy"
              exit 0
            fi
            echo "Waiting for application..."
            sleep 5
          done
          docker compose logs
          exit 1

      # --- ОСТАНОВКА ---
      - name: Stop Docker Compose
        if: always()
        run: |
          POSTGRES_USER=postgres \
          POSTGRES_PASSWORD=1234 \
          POSTGRES_DB=videogames_shop \
          POSTGRES_PORT=5432 \
          APP_PORT=8080 \
          SPRING_JPA_HIBERNATE_DDL_AUTO=validate \
          docker compose down

  # --- DEPLOY ---
  deploy:
    needs: build-test-healthcheck
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Render
        run: curl "$RENDER_DEPLOY_HOOK"
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}