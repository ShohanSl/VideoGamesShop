name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-deploy:
    name: Build, test, deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run backend tests
        env:
          JWT_SECRET: test_secret_key_for_ci_32_characters_min
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/videogames_shop
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
        run: ./mvnw -B test

      - name: Build Docker image
        run: docker build -t videogames-shop:${{ github.sha }} .

      - name: Trigger Render deploy
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK_URL"
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Healthcheck Render service
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          RENDER_APP_URL: ${{ secrets.RENDER_APP_URL }}
        run: |
          test -n "$RENDER_APP_URL"
          echo "Waiting for Render deployment to become healthy..."
          sleep 60
          for attempt in {1..45}; do
            echo "Healthcheck attempt $attempt/45"
            if curl -fsS "$RENDER_APP_URL/actuator/health"; then
              echo "Render service is healthy."
              exit 0
            fi
            sleep 20
          done
          echo "Render service did not become healthy in time."
          exit 1
