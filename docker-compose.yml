services:
  db:
    image: postgres:16-alpine
    container_name: videogames-shop-db
    restart: always
    environment:
      POSTGRES_DB: videogames_shop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_pass}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d videogames_shop"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: videogames-shop-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/videogames_shop
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres_pass}
      JWT_SECRET: ${JWT_SECRET:-defaultSecretKeyForDevelopmentOnly1234567890}

      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
